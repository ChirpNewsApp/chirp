<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Chirp</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Pacifico&display=swap" rel="stylesheet">
<style>
  :root {
    --bg: #000;
    --panel: #16181c;
    --text: #e7e9ea;
    --muted: #71767b;
    --border: #2f3336;
    --accent: #1d9bf0;
    --accent-hover: #1a8cd8;
    --like: #f91880;
    --repost: #00ba7c;
    --gold: #d4a017;
    --hover: rgba(231, 233, 234, 0.03);
    --hover-strong: rgba(231, 233, 234, 0.1);
    --danger: #f4212e;
  }
  * { box-sizing: border-box; margin: 0; padding: 0; }
  html, body {
    background: var(--bg);
    color: var(--text);
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", sans-serif;
    height: 100%;
    overflow: hidden;
  }
  button { font-family: inherit; cursor: pointer; border: none; background: none; color: inherit; }
  input, textarea {
    font-family: inherit;
    background: transparent;
    border: 1px solid var(--border);
    color: var(--text);
    padding: 12px;
    border-radius: 4px;
    width: 100%;
    outline: none;
    font-size: 15px;
  }
  input:focus, textarea:focus { border-color: var(--accent); }
  textarea { resize: none; }

  /* ===== Auth screen ===== */
  #auth {
    display: flex;
    height: 100vh;
    align-items: center;
    justify-content: center;
    padding: 20px;
  }
  .auth-card {
    width: 100%;
    max-width: 380px;
    padding: 32px 28px;
  }
  .logo {
    text-align: center;
    margin-bottom: 24px;
  }
  .logo svg { width: 36px; height: 36px; fill: var(--text); }
  .auth-card h1 {
    font-size: 28px;
    font-weight: 800;
    margin-bottom: 24px;
    text-align: center;
  }
  .auth-card .field { margin-bottom: 14px; }
  .auth-card button.primary {
    width: 100%;
    background: var(--text);
    color: #000;
    font-weight: 700;
    padding: 12px;
    border-radius: 999px;
    margin-top: 8px;
    font-size: 15px;
  }
  .auth-card button.primary:hover { background: #d7d9da; }
  .auth-card button.primary:disabled { opacity: 0.5; cursor: not-allowed; }
  .auth-toggle {
    text-align: center;
    margin-top: 16px;
    color: var(--muted);
    font-size: 14px;
  }
  .auth-toggle a { color: var(--accent); cursor: pointer; }
  .auth-toggle a:hover { text-decoration: underline; }
  .auth-error {
    background: rgba(244, 33, 46, 0.1);
    border: 1px solid rgba(244, 33, 46, 0.3);
    color: var(--danger);
    padding: 10px;
    border-radius: 4px;
    margin-bottom: 12px;
    font-size: 14px;
    display: none;
  }
  .auth-error.show { display: block; }

  /* ===== App layout ===== */
  #app { display: none; height: 100vh; }
  .layout {
    display: grid;
    grid-template-columns: 275px minmax(0, 600px) 350px;
    height: 100%;
    max-width: 1265px;
    margin: 0 auto;
  }
  @media (max-width: 1100px) {
    .layout { grid-template-columns: 88px minmax(0, 600px) 350px; }
    .nav-label { display: none; }
    .post-btn-full { display: none; }
    .post-btn-icon { display: flex !important; }
    .nav-item { justify-content: center; }
    .me-card { display: none; }
  }
  @media (max-width: 850px) {
    .layout { grid-template-columns: 88px minmax(0, 1fr); }
    .right-panel { display: none; }
  }

  /* Left sidebar */
  aside.left {
    border-right: 1px solid var(--border);
    padding: 8px 12px;
    display: flex;
    flex-direction: column;
    height: 100%;
  }
  .left-logo {
    padding: 12px;
    margin-bottom: 4px;
  }
  .left-logo svg { width: 30px; height: 30px; fill: var(--text); }
  nav.menu { flex: 1; }
  .nav-item {
    display: flex;
    align-items: center;
    gap: 16px;
    padding: 12px;
    border-radius: 999px;
    font-size: 20px;
    margin-bottom: 2px;
    transition: background 0.15s;
    width: fit-content;
    max-width: 100%;
  }
  .nav-item:hover { background: var(--hover-strong); }
  .nav-item svg { width: 26px; height: 26px; fill: var(--text); flex-shrink: 0; }
  .nav-item.active { font-weight: 700; }
  .post-btn-full {
    width: 100%;
    background: var(--accent);
    color: white;
    font-weight: 700;
    padding: 14px;
    border-radius: 999px;
    font-size: 16px;
    margin-top: 16px;
  }
  .post-btn-full:hover { background: var(--accent-hover); }
  .post-btn-icon {
    display: none;
    width: 50px;
    height: 50px;
    background: var(--accent);
    border-radius: 999px;
    align-items: center;
    justify-content: center;
    margin: 16px auto 0;
  }
  .post-btn-icon:hover { background: var(--accent-hover); }
  .post-btn-icon svg { width: 24px; height: 24px; fill: white; }
  .me-card {
    display: flex;
    align-items: center;
    gap: 10px;
    padding: 12px;
    border-radius: 999px;
    margin-top: 12px;
    cursor: pointer;
  }
  .me-card:hover { background: var(--hover-strong); }
  .me-card .meta { flex: 1; min-width: 0; overflow: hidden; }
  .me-card .name {
    font-weight: 700;
    font-size: 15px;
    display: flex;
    align-items: center;
    gap: 4px;
    white-space: nowrap;
    overflow: hidden;
    text-overflow: ellipsis;
  }
  .me-card .handle {
    color: var(--muted);
    font-size: 14px;
    white-space: nowrap;
    overflow: hidden;
    text-overflow: ellipsis;
  }
  .me-card .more { color: var(--muted); font-size: 18px; }

  /* Main column */
  main.center {
    border-right: 1px solid var(--border);
    overflow-y: auto;
    height: 100%;
  }
  main.center::-webkit-scrollbar { width: 6px; }
  main.center::-webkit-scrollbar-thumb { background: #2f3336; border-radius: 3px; }
  .top-bar {
    position: sticky;
    top: 0;
    background: rgba(0, 0, 0, 0.7);
    backdrop-filter: blur(12px);
    border-bottom: 1px solid var(--border);
    z-index: 10;
  }
  .top-bar h2 {
    padding: 16px;
    font-size: 20px;
    font-weight: 700;
    display: flex;
    align-items: center;
    gap: 24px;
  }
  .top-bar .back-btn {
    width: 36px; height: 36px;
    border-radius: 999px;
    display: flex; align-items: center; justify-content: center;
  }
  .top-bar .back-btn:hover { background: var(--hover-strong); }
  .top-bar .back-btn svg { width: 20px; height: 20px; fill: var(--text); }

  /* Compose */
  .compose {
    display: flex;
    gap: 12px;
    padding: 16px;
    border-bottom: 1px solid var(--border);
  }
  .compose .body { flex: 1; }
  .compose textarea {
    border: none;
    padding: 12px 0;
    font-size: 20px;
    min-height: 56px;
    width: 100%;
    background: transparent;
    color: var(--text);
  }
  .compose textarea::placeholder { color: var(--muted); }
  .compose-actions {
    display: flex;
    justify-content: space-between;
    align-items: center;
    padding-top: 12px;
    border-top: 1px solid var(--border);
  }
  .char-count {
    font-size: 13px;
    color: var(--muted);
    margin-right: 12px;
  }
  .char-count.warn { color: var(--gold); }
  .char-count.bad { color: var(--danger); }
  .post-action-btn {
    background: var(--accent);
    color: white;
    font-weight: 700;
    padding: 8px 18px;
    border-radius: 999px;
    font-size: 15px;
  }
  .post-action-btn:hover { background: var(--accent-hover); }
  .post-action-btn:disabled { opacity: 0.5; cursor: not-allowed; }

  /* Brand logo */
  .brand-logo {
    font-family: 'Pacifico', 'Brush Script MT', cursive;
    color: var(--text);
    line-height: 1;
    display: inline-block;
    user-select: none;
  }
  .logo .brand-logo { font-size: 44px; }
  .left-logo .brand-logo { font-size: 28px; }
  .left-logo .brand-mini { display: none; }
  @media (max-width: 1100px) {
    .left-logo .brand-full { display: none; }
    .left-logo .brand-mini { display: inline-block; font-size: 36px; }
  }

  /* Avatar */
  .avatar {
    width: 40px;
    height: 40px;
    border-radius: 999px;
    background: var(--accent);
    display: flex;
    align-items: center;
    justify-content: center;
    color: white;
    font-weight: 700;
    flex-shrink: 0;
    font-size: 16px;
    user-select: none;
    background-size: cover;
    background-position: center;
    overflow: hidden;
  }
  .avatar.avatar-img { background-color: #000; color: transparent; }
  .avatar.lg {
    width: 134px;
    height: 134px;
    font-size: 56px;
    border: 4px solid var(--bg);
  }

  /* Avatar editor */
  .avatar-editor {
    display: flex;
    align-items: center;
    gap: 16px;
    margin-bottom: 16px;
  }
  .avatar-editor .preview {
    width: 80px;
    height: 80px;
    border-radius: 999px;
    background-size: cover;
    background-position: center;
    display: flex;
    align-items: center;
    justify-content: center;
    color: white;
    font-weight: 700;
    font-size: 28px;
    flex-shrink: 0;
  }
  .avatar-editor .controls { flex: 1; }
  .avatar-editor button.upload-btn {
    background: var(--text);
    color: #000;
    font-weight: 700;
    padding: 8px 14px;
    border-radius: 999px;
    font-size: 13px;
    margin-right: 6px;
  }
  .avatar-editor button.upload-btn:hover { background: #d7d9da; }
  .avatar-editor button.clear-btn {
    background: transparent;
    color: var(--text);
    border: 1px solid var(--border);
    padding: 8px 14px;
    border-radius: 999px;
    font-size: 13px;
  }
  .avatar-editor button.clear-btn:hover { background: var(--hover-strong); }
  .color-swatches {
    display: flex;
    gap: 6px;
    margin-top: 10px;
    flex-wrap: wrap;
  }
  .color-swatch {
    width: 26px;
    height: 26px;
    border-radius: 999px;
    cursor: pointer;
    border: 2px solid transparent;
    transition: transform 0.1s;
  }
  .color-swatch:hover { transform: scale(1.15); }
  .color-swatch.selected { border-color: var(--text); }

  /* Tweet */
  .tweet {
    display: flex;
    gap: 12px;
    padding: 12px 16px;
    border-bottom: 1px solid var(--border);
    cursor: pointer;
    transition: background 0.1s;
  }
  .tweet:hover { background: var(--hover); }
  .tweet .body { flex: 1; min-width: 0; }
  .tweet .head {
    display: flex;
    align-items: center;
    gap: 4px;
    font-size: 15px;
    margin-bottom: 2px;
  }
  .tweet .name {
    font-weight: 700;
    color: var(--text);
    white-space: nowrap;
    overflow: hidden;
    text-overflow: ellipsis;
    max-width: 180px;
  }
  .tweet .handle, .tweet .dot, .tweet .time {
    color: var(--muted);
  }
  .tweet .menu-btn {
    margin-left: auto;
    color: var(--muted);
    width: 30px; height: 30px;
    border-radius: 999px;
    display: flex; align-items: center; justify-content: center;
  }
  .tweet .menu-btn:hover { background: rgba(29, 155, 240, 0.1); color: var(--accent); }
  .tweet .menu-btn svg { width: 18px; height: 18px; fill: currentColor; }
  .tweet .text {
    font-size: 15px;
    line-height: 1.35;
    white-space: pre-wrap;
    word-wrap: break-word;
  }
  .tweet .reply-context {
    color: var(--muted);
    font-size: 14px;
    margin-bottom: 4px;
  }
  .tweet .reply-context a { color: var(--accent); }
  .actions {
    display: flex;
    justify-content: space-between;
    margin-top: 12px;
    max-width: 425px;
    color: var(--muted);
  }
  .action {
    display: flex;
    align-items: center;
    gap: 4px;
    font-size: 13px;
    padding: 4px;
    border-radius: 999px;
    transition: color 0.15s, background 0.15s;
  }
  .action svg { width: 18px; height: 18px; fill: currentColor; }
  .action .icon-wrap {
    width: 30px; height: 30px;
    display: flex; align-items: center; justify-content: center;
    border-radius: 999px;
    margin-right: -4px;
  }
  .action.reply:hover { color: var(--accent); }
  .action.reply:hover .icon-wrap { background: rgba(29, 155, 240, 0.1); }
  .action.repost:hover, .action.repost.active { color: var(--repost); }
  .action.repost:hover .icon-wrap { background: rgba(0, 186, 124, 0.1); }
  .action.like:hover, .action.like.active { color: var(--like); }
  .action.like:hover .icon-wrap { background: rgba(249, 24, 136, 0.1); }
  .action.delete:hover { color: var(--danger); }
  .action.delete:hover .icon-wrap { background: rgba(244, 33, 46, 0.1); }
  .repost-banner {
    display: flex; align-items: center; gap: 10px;
    color: var(--muted); font-size: 13px;
    padding: 10px 16px 0 50px;
    font-weight: 600;
  }
  .repost-banner svg { width: 14px; height: 14px; fill: currentColor; }

  /* Empty state */
  .empty {
    text-align: center;
    padding: 60px 20px;
    color: var(--muted);
  }
  .empty h3 { color: var(--text); font-size: 22px; margin-bottom: 8px; }

  /* Verified badge */
  .badge {
    width: 18px; height: 18px;
    flex-shrink: 0;
    display: inline-block;
    vertical-align: middle;
  }
  .badge.blue { fill: var(--accent); }
  .badge.gold { fill: var(--gold); }

  /* Right sidebar */
  aside.right {
    padding: 12px 16px;
    overflow-y: auto;
    height: 100%;
  }
  aside.right::-webkit-scrollbar { width: 6px; }
  aside.right::-webkit-scrollbar-thumb { background: #2f3336; border-radius: 3px; }
  .panel {
    background: var(--panel);
    border-radius: 16px;
    padding: 12px 0;
    margin-bottom: 16px;
  }
  .panel h3 {
    padding: 4px 16px 12px;
    font-size: 20px;
    font-weight: 800;
  }
  .panel-item {
    padding: 10px 16px;
    cursor: pointer;
  }
  .panel-item:hover { background: var(--hover-strong); }
  .panel-item .small { color: var(--muted); font-size: 13px; }
  .panel-item .name {
    font-weight: 700;
    display: flex;
    align-items: center;
    gap: 4px;
  }
  .panel-item .followers { color: var(--muted); font-size: 13px; }

  /* Profile page */
  .profile-banner {
    height: 200px;
    background: linear-gradient(135deg, #1d9bf0, #0e3a5e);
  }
  .profile-head {
    padding: 0 16px 16px;
    border-bottom: 1px solid var(--border);
    position: relative;
  }
  .profile-head .avatar-wrap {
    margin-top: -67px;
    display: flex;
    justify-content: space-between;
    align-items: flex-end;
    margin-bottom: 12px;
  }
  .profile-edit-btn {
    border: 1px solid var(--border);
    color: var(--text);
    font-weight: 700;
    padding: 8px 16px;
    border-radius: 999px;
    margin-top: 67px;
  }
  .profile-edit-btn:hover { background: var(--hover-strong); }
  .follow-btn {
    background: var(--text);
    color: #000;
    font-weight: 700;
    padding: 8px 18px;
    border-radius: 999px;
    margin-top: 67px;
    font-size: 14px;
    border: 1px solid transparent;
    transition: background 0.15s, color 0.15s, border-color 0.15s;
    min-width: 100px;
  }
  .follow-btn:hover { background: #d7d9da; }
  .follow-btn.following {
    background: transparent;
    color: var(--text);
    border-color: var(--border);
  }
  .follow-btn.following:hover {
    color: var(--danger);
    border-color: rgba(244, 33, 46, 0.4);
    background: rgba(244, 33, 46, 0.1);
  }
  .follow-btn .label-following,
  .follow-btn .label-unfollow,
  .follow-btn.following .label-follow { display: none; }
  .follow-btn.following .label-following { display: inline; }
  .follow-btn.following:hover .label-following { display: none; }
  .follow-btn.following:hover .label-unfollow { display: inline; }
  @media (max-width: 650px) {
    .follow-btn { margin-top: 45px; padding: 6px 14px; font-size: 13px; min-width: 80px; }
  }
  .profile-name {
    font-size: 20px;
    font-weight: 800;
    display: flex;
    align-items: center;
    gap: 4px;
  }
  .profile-name .badge { width: 22px; height: 22px; }
  .profile-handle { color: var(--muted); margin-bottom: 12px; }
  .profile-bio { margin-bottom: 12px; white-space: pre-wrap; }
  .profile-meta { color: var(--muted); font-size: 14px; }
  .profile-stats { display: flex; gap: 20px; margin-top: 12px; font-size: 14px; }
  .profile-stats > div { cursor: pointer; }
  .profile-stats > div:hover .label { text-decoration: underline; }
  .profile-stats b { color: var(--text); margin-right: 4px; }
  .profile-stats .label { color: var(--muted); }

  /* Home feed tabs */
  .feed-tabs {
    display: flex;
    border-bottom: 1px solid var(--border);
    position: sticky;
    top: 53px;
    background: rgba(0, 0, 0, 0.85);
    backdrop-filter: blur(12px);
    z-index: 9;
  }
  .feed-tab {
    flex: 1;
    text-align: center;
    padding: 16px;
    cursor: pointer;
    color: var(--muted);
    font-weight: 600;
    position: relative;
    transition: background 0.15s;
    user-select: none;
  }
  .feed-tab:hover { background: var(--hover); }
  .feed-tab.active { color: var(--text); font-weight: 700; }
  .feed-tab.active::after {
    content: '';
    position: absolute;
    bottom: 0;
    left: 50%;
    transform: translateX(-50%);
    width: 56px;
    height: 4px;
    background: var(--accent);
    border-radius: 999px;
  }

  /* Settings */
  .settings-section {
    padding: 16px;
    border-bottom: 1px solid var(--border);
  }
  .settings-section h3 {
    font-size: 18px;
    margin-bottom: 8px;
  }
  .settings-section p {
    color: var(--muted);
    font-size: 14px;
    margin-bottom: 12px;
  }
  .badge-options {
    display: flex;
    gap: 12px;
    flex-wrap: wrap;
  }
  .badge-option {
    border: 1px solid var(--border);
    border-radius: 12px;
    padding: 14px;
    flex: 1;
    min-width: 140px;
    cursor: pointer;
    transition: border-color 0.2s;
  }
  .badge-option:hover { border-color: var(--accent); }
  .badge-option.selected { border-color: var(--accent); background: rgba(29, 155, 240, 0.05); }
  .badge-option .row { display: flex; align-items: center; gap: 8px; margin-bottom: 6px; }
  .badge-option .row .badge { width: 22px; height: 22px; }
  .badge-option .row b { font-size: 15px; }
  .badge-option .desc { font-size: 13px; color: var(--muted); }
  .save-btn {
    background: var(--text);
    color: #000;
    font-weight: 700;
    padding: 10px 20px;
    border-radius: 999px;
    margin-top: 12px;
  }
  .save-btn:hover { background: #d7d9da; }
  .logout-btn {
    background: transparent;
    color: var(--danger);
    border: 1px solid var(--border);
    font-weight: 700;
    padding: 10px 20px;
    border-radius: 999px;
  }
  .logout-btn:hover { background: rgba(244, 33, 46, 0.1); }

  /* Modal */
  .modal-backdrop {
    position: fixed; inset: 0;
    background: rgba(91, 112, 131, 0.4);
    display: none;
    align-items: flex-start;
    justify-content: center;
    z-index: 100;
    padding-top: 60px;
  }
  .modal-backdrop.show { display: flex; }
  .modal {
    background: var(--bg);
    border-radius: 16px;
    width: 100%;
    max-width: 600px;
    max-height: 90vh;
    overflow-y: auto;
  }
  .modal-head {
    display: flex;
    align-items: center;
    padding: 8px 16px;
    height: 53px;
    border-bottom: 1px solid var(--border);
  }
  .modal-close {
    width: 34px; height: 34px;
    border-radius: 999px;
    display: flex; align-items: center; justify-content: center;
  }
  .modal-close:hover { background: var(--hover-strong); }
  .modal-close svg { width: 20px; height: 20px; fill: var(--text); }

  /* Admin & Affiliates */
  .admin-row {
    display: flex;
    align-items: center;
    gap: 12px;
    padding: 12px 16px;
    border-bottom: 1px solid var(--border);
  }
  .admin-row .meta { flex: 1; min-width: 0; }
  .admin-row .meta .name {
    font-weight: 700;
    display: flex;
    align-items: center;
    gap: 4px;
    white-space: nowrap;
    overflow: hidden;
    text-overflow: ellipsis;
  }
  .admin-row .meta .handle { color: var(--muted); font-size: 13px; }
  .admin-row select {
    background: var(--bg);
    border: 1px solid var(--border);
    color: var(--text);
    padding: 6px 10px;
    border-radius: 4px;
    font-size: 14px;
    cursor: pointer;
  }
  .admin-row select:focus { outline: none; border-color: var(--accent); }
  .admin-row label.adm {
    display: flex;
    align-items: center;
    gap: 6px;
    font-size: 13px;
    color: var(--muted);
    cursor: pointer;
    user-select: none;
  }

<script>
/* Surface any uncaught error visibly instead of failing silently. */
window.addEventListener('error', (e) => {
  const errEl = document.getElementById('auth-error');
  if (errEl) {
    errEl.textContent = 'Error: ' + (e.message || 'unknown');
    errEl.classList.add('show');
  }
});
window.addEventListener('unhandledrejection', (e) => {
  const errEl = document.getElementById('auth-error');
  if (errEl) {
    errEl.textContent = 'Error: ' + (e.reason?.message || e.reason || 'unknown');
    errEl.classList.add('show');
  }
});

/* =========================================================
   Storage layer — uses localStorage when available, falls back
   to in-memory storage for environments that block it (e.g.
   data: URL previews, sandboxed iframes, private mode).
   ========================================================= */
const _memStore = {};
const storage = (() => {
  let useLocal = false;
  try {
    const t = '__chirp_test__';
    window.localStorage.setItem(t, '1');
    window.localStorage.removeItem(t);
    useLocal = true;
  } catch (e) {
    useLocal = false;
  }
  return {
    get(k) {
      try { return useLocal ? window.localStorage.getItem(k) : (_memStore[k] ?? null); }
      catch (e) { return _memStore[k] ?? null; }
    },
    set(k, v) {
      try { if (useLocal) window.localStorage.setItem(k, v); else _memStore[k] = v; }
      catch (e) { _memStore[k] = v; }
    },
    remove(k) {
      try { if (useLocal) window.localStorage.removeItem(k); else delete _memStore[k]; }
      catch (e) { delete _memStore[k]; }
    },
    persistent: useLocal,
  };
})();

const DB_KEY = 'chirp.db.v1';
const SESSION_KEY = 'chirp.session.v1';
const DB_VERSION_KEY = 'chirp.version';
const DB_VERSION = '2'; // bump this number to force a wipe on next load

/* =========================================================
   Cloud sync (optional, via JSONBin free tier)
   To enable cross-device sync:
     1. Sign up free at https://jsonbin.io (takes 60 seconds, no card)
     2. Click "Create Bin" → set content to: {"users":{},"posts":[]} → Save
     3. Copy your Bin ID (the long string in the bin's URL)
     4. Go to Account → API Keys → copy your Master Key
     5. Paste both below, push to GitHub. Sync works automatically.
   Leave them empty for local-only mode.
   ========================================================= */
const CLOUD = {
  binId: '69fdc8cc250b1311c31f66fa',
  masterKey: '$2a$10$TrB7zO2XgfdTFJ3fiioCrOIpLCginb3kCnF6KOWtvJDBeq1EUDyeS',
};
const CLOUD_ENABLED = !!(CLOUD.binId && CLOUD.masterKey);
let _cloudPushTimer = null;

async function cloudPull() {
  if (!CLOUD_ENABLED) return null;
  try {
    const res = await fetch(`https://api.jsonbin.io/v3/b/${CLOUD.binId}/latest`, {
      headers: { 'X-Master-Key': CLOUD.masterKey, 'X-Bin-Meta': 'false' }
    });
    if (!res.ok) return null;
    const remote = await res.json();
    if (remote && typeof remote.users === 'object' && remote.users !== null && Array.isArray(remote.posts)) {
      return remote;
    }
    if (remote && remote.record && typeof remote.record.users === 'object') return remote.record;
  } catch (e) { console.warn('Cloud pull failed:', e); }
  return null;
}

function cloudPush() {
  if (!CLOUD_ENABLED) return;
  clearTimeout(_cloudPushTimer);
  _cloudPushTimer = setTimeout(async () => {
    try {
      await fetch(`https://api.jsonbin.io/v3/b/${CLOUD.binId}`, {
        method: 'PUT',
        headers: {
          'Content-Type': 'application/json',
          'X-Master-Key': CLOUD.masterKey
        },
        body: JSON.stringify(db)
      });
    } catch (e) { console.warn('Cloud push failed:', e); }
  }, 1200);
}
// Auto-wipe if version mismatch
(function autoReset() {
  try {
    if (storage.get(DB_VERSION_KEY) !== DB_VERSION) {
      storage.remove(DB_KEY);
      storage.remove(SESSION_KEY);
      storage.set(DB_VERSION_KEY, DB_VERSION);
    }
  } catch (e) {}
})();

function loadDB() {
  let db;
  try {
    const raw = storage.get(DB_KEY);
    db = raw ? JSON.parse(raw) : { users: {}, posts: [] };
  } catch (e) {
    db = { users: {}, posts: [] };
  }
  // Migration: ensure all users have admin/affiliation/avatar/follow/custom-badge fields
  for (const u of Object.values(db.users)) {
    if (typeof u.isAdmin === 'undefined') u.isAdmin = false;
    if (typeof u.affiliatedTo === 'undefined') u.affiliatedTo = null;
    if (typeof u.avatarImage === 'undefined') u.avatarImage = null;
    if (typeof u.avatarColor === 'undefined') u.avatarColor = null;
    if (!Array.isArray(u.following)) u.following = [];
    if (typeof u.customBadge === 'undefined') u.customBadge = null;
  }
  // If users exist but no admin yet, promote earliest-joined user
  const userList = Object.values(db.users);
  if (userList.length > 0 && !userList.some(u => u.isAdmin)) {
    userList.sort((a, b) => a.joinedAt - b.joinedAt)[0].isAdmin = true;
  }
  return db;
}
function saveDB(db) {
  storage.set(DB_KEY, JSON.stringify(db));
  cloudPush();
}
function getSession() { return storage.get(SESSION_KEY); }
function setSession(u) { storage.set(SESSION_KEY, u); }
function clearSession() { storage.remove(SESSION_KEY); }

/* Simple synchronous hash so passwords aren't stored as bare plaintext.
   Note: localStorage demo only — not real security. */
function hashPassword(pw) {
  const s = pw + 'chirp-salt-v1';
  let h1 = 0x811c9dc5, h2 = 0xdeadbeef;
  for (let i = 0; i < s.length; i++) {
    const c = s.charCodeAt(i);
    h1 = Math.imul(h1 ^ c, 16777619) >>> 0;
    h2 = Math.imul(h2 ^ c, 2246822507) >>> 0;
  }
  return h1.toString(16).padStart(8, '0') + h2.toString(16).padStart(8, '0');
}

let db = loadDB();
let currentUser = null;
let currentRoute = 'home';
let viewingProfile = null; // username of profile being viewed
let homeTab = 'for-you'; // 'for-you' or 'following'

/* =========================================================
   Helpers
   ========================================================= */
function $(id) { return document.getElementById(id); }
function escapeHtml(s) {
  return String(s).replace(/[&<>"']/g, c => ({
    '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;'
  }[c]));
}
function timeAgo(ts) {
  const s = Math.floor((Date.now() - ts) / 1000);
  if (s < 60) return s + 's';
  if (s < 3600) return Math.floor(s / 60) + 'm';
  if (s < 86400) return Math.floor(s / 3600) + 'h';
  if (s < 604800) return Math.floor(s / 86400) + 'd';
  const d = new Date(ts);
  return d.toLocaleDateString(undefined, { month: 'short', day: 'numeric' });
}
const AVATAR_COLORS = ['#1d9bf0', '#7856ff', '#f91880', '#ff7a00', '#00ba7c', '#1eb6ad', '#d4a017', '#e0245e', '#5a5a5a'];
function avatarColor(seed) {
  // Look up the user — if they've picked a custom color, use that
  const u = db.users[seed];
  if (u && u.avatarColor) return u.avatarColor;
  let h = 0;
  for (let i = 0; i < seed.length; i++) h = (h * 31 + seed.charCodeAt(i)) & 0xffffffff;
  return AVATAR_COLORS[Math.abs(h) % AVATAR_COLORS.length];
}
function initials(name) {
  return name.trim().split(/\s+/).map(p => p[0]).slice(0, 2).join('').toUpperCase();
}
function avatarHTML(user, opts = {}) {
  const cls = opts.cls || '';
  const extra = opts.style || '';
  if (user.avatarImage) {
    return `<div class="avatar avatar-img ${cls}" style="background-image:url('${user.avatarImage}');${extra}"></div>`;
  }
  const color = user.avatarColor || avatarColor(user.username);
  return `<div class="avatar ${cls}" style="background:${color};${extra}">${initials(user.name)}</div>`;
}
function showToast(msg) {
  const t = $('toast');

}

function badgeSVG(type) {
  if (!type || type === 'none') return '';
  const cls = type === 'gold' ? 'gold' : 'blue';
  return `<svg class="badge ${cls}" viewBox="0 0 24 24" aria-label="Verified" role="img"><path d="${BADGE_PATH}"/></svg>`;
}

function isFollowing(targetUsername) {
  return (currentUser?.following || []).includes(targetUsername);
}
function toggleFollow(targetUsername) {
  if (targetUsername === currentUser.username) return;
  currentUser.following = currentUser.following || [];
  const i = currentUser.following.indexOf(targetUsername);
  if (i >= 0) currentUser.following.splice(i, 1);
  else currentUser.following.push(targetUsername);
  db.users[currentUser.username] = currentUser;
  saveDB(db);
}
function followerCount(username) {
  return Object.values(db.users).filter(u =>
    u.username !== username && (u.following || []).includes(username)
  ).length;
}
function followingCount(username) {
  const u = db.users[username];
  return (u && u.following ? u.following.length : 0);
}

function affiliationBadge(user) {
  if (!user || !user.affiliatedTo) return '';
  const org = db.users[user.affiliatedTo];
  if (!org || org.verified !== 'gold') return '';
  if (org.avatarImage) {

function customBadge(user) {

/* =========================================================
   Auth
   ========================================================= */
let isSignup = false;

function setAuthMode(signup) {
  isSignup = signup;
  $('auth-title').textContent = signup ? 'Create your account' : 'Sign in to Chirp';
  $('auth-submit').textContent = signup ? 'Sign up' : 'Sign in';
  $('field-name').style.display = signup ? '' : 'none';
  $('auth-toggle-text').textContent = signup ? 'Already have an account?' : "Don't have an account?";
  $('auth-toggle-link').textContent = signup ? 'Sign in' : 'Sign up';
  $('auth-error').classList.remove('show');
}

$('auth-toggle-link').addEventListener('click', () => setAuthMode(!isSignup));

$('auth-form').addEventListener('submit', (e) => {
  e.preventDefault();
  const username = $('auth-username').value.trim().toLowerCase();
  const password = $('auth-password').value;
  const errEl = $('auth-error');
  errEl.classList.remove('show');

  function fail(msg) { errEl.textContent = msg; errEl.classList.add('show'); }

  if (!/^[a-z0-9_]{3,20}$/.test(username)) {
    return fail('Username must be 3–20 chars (letters, numbers, underscore).');
  }
  if (password.length < 4) {
    return fail('Password must be at least 4 characters.');
  }

  let hash;
  try { hash = hashPassword(password); }
  catch (err) { return fail('Hashing failed: ' + err.message); }

  if (isSignup) {
    const name = $('signup-name').value.trim();
    if (!name) return fail('Display name is required.');
    if (db.users[username]) return fail('That username is already taken.');
    const isFirstUser = Object.keys(db.users).length === 0;
    db.users[username] = {
      username,
      name,
      passwordHash: hash,
      bio: '',
      verified: 'none',
      isAdmin: isFirstUser,
      affiliatedTo: null,
      avatarImage: null,
      avatarColor: null,
      customBadge: null,
      joinedAt: Date.now(),
      following: [],
    };
    saveDB(db);
    setSession(username);
    enterApp();
  } else {
    const u = db.users[username];
    if (!u || u.passwordHash !== hash) {
      return fail('Invalid username or password.');
    }
    setSession(username);
    enterApp();
  }
});

function renderFeed() {
  const feed = $('feed');
  const followingList = currentUser.following || [];
  const isFollowingTab = homeTab === 'following';
  const visibleAuthor = (uname) =>
    !isFollowingTab || uname === currentUser.username || followingList.includes(uname);

  const items = [];
  for (const post of db.posts) {
    if (post.deleted) continue;
    if (visibleAuthor(post.authorUsername)) {
      items.push({ kind: 'post', post, t: post.createdAt });
    }
    for (const reposterUsername of (post.reposts || [])) {
      if (!visibleAuthor(reposterUsername)) continue;
      const reposter = db.users[reposterUsername];
      if (reposter) {
        items.push({ kind: 'repost', post, by: reposter, t: post.repostTimes?.[reposterUsername] || post.createdAt });
      }
    }
  }
  items.sort((a, b) => b.t - a.t);

  if (items.length === 0) {
    if (isFollowingTab) {
      feed.innerHTML = `
        <div class="empty">
          <h3>Nothing here yet</h3>
          <p>Follow people to see their posts in this tab.</p>
        </div>
      `;
    } else {
      feed.innerHTML = `
        <div class="empty">
          <h3>Welcome to Chirp.</h3>
          <p>Your feed is empty. Post something to get it started.</p>
        </div>
      `;
    }
    return;
  }
  feed.innerHTML = items.map(item => renderTweetCard(item)).join('');
  wireTweets();
}

function wireTweets() {
  document.querySelectorAll('.profile-link').forEach(el => {
    el.addEventListener('click', (e) => {
      e.stopPropagation();
      navigate('profile', { username: el.dataset.user });
    });
  });
  document.querySelectorAll('.action').forEach(btn => {
    btn.addEventListener('click', (e) => {
      e.stopPropagation();
      const id = btn.dataset.id;
      const post = db.posts.find(p => p.id === id);
      if (!post) return;
      if (btn.dataset.act === 'like') toggleLike(post);
      else if (btn.dataset.act === 'repost') toggleRepost(post);
      else if (btn.dataset.act === 'reply') openReply(post);
      else if (btn.dataset.act === 'delete') deletePost(post);
    });
  });
}

function wireCompose(textEl, submitEl, countEl, replyTo) {
  function update() {
    const len = textEl.value.length;
    countEl.textContent = 280 - len;
    countEl.className = 'char-count' + (len > 260 ? ' warn' : '') + (len > 280 ? ' bad' : '');
    submitEl.disabled = len === 0 || len > 280;
  }
  textEl.addEventListener('input', update);
  submitEl.addEventListener('click', () => {
    const text = textEl.value.trim();
    if (!text) return;
    createPost(text, replyTo);
    textEl.value = '';
    update();
    if (replyTo) closeComposeModal();
    showToast('Posted');
  });
  update();
}

function createPost(text, replyToId) {
  const post = {
    id: 'p_' + Date.now() + '_' + Math.random().toString(36).slice(2, 8),
    authorUsername: currentUser.username,
    text,
    createdAt: Date.now(),
    likes: [],
    reposts: [],
    repostTimes: {},
    replies: [],
    replyTo: replyToId || null,
    deleted: false,
  };
  db.posts.unshift(post);
  if (replyToId) {
    const parent = db.posts.find(p => p.id === replyToId);
    if (parent) {
      parent.replies = parent.replies || [];
      parent.replies.push(post.id);
    }
  }
  saveDB(db);
  if (currentRoute === 'home') renderFeed();
  else if (currentRoute === 'profile') renderProfile();
}

function toggleLike(post) {
  post.likes = post.likes || [];
  const i = post.likes.indexOf(currentUser.username);
  if (i >= 0) post.likes.splice(i, 1);
  else post.likes.push(currentUser.username);
  saveDB(db);
  render();
}

function toggleRepost(post) {
  post.reposts = post.reposts || [];
  post.repostTimes = post.repostTimes || {};
  const i = post.reposts.indexOf(currentUser.username);
  if (i >= 0) {
    post.reposts.splice(i, 1);
    delete post.repostTimes[currentUser.username];
  } else {
    post.reposts.push(currentUser.username);
    post.repostTimes[currentUser.username] = Date.now();
  }
  saveDB(db);
  render();
}

function deletePost(post) {
  if (!confirm('Delete this post? This cannot be undone.')) return;
  post.deleted = true;
  saveDB(db);
  render();
  showToast('Deleted');
}

   ========================================================= */
function renderProfile() {
  const u = db.users[viewingProfile] || currentUser;
  const isMe = u.username === currentUser.username;
  const myPosts = db.posts.filter(p => !p.deleted && p.authorUsername === u.username);
  const followers = followerCount(u.username);
  const followingN = followingCount(u.username);
  const followingThem = !isMe && isFollowing(u.username);
  const main = $('main-content');

  const headerBtn = isMe
    ? '<button class="profile-edit-btn" id="edit-profile-btn">Edit profile</button>'
    : `<button class="follow-btn ${followingThem ? 'following' : ''}" id="follow-btn">
         <span class="label-follow">Follow</span>
         <span class="label-following">Following</span>
         <span class="label-unfollow">Unfollow</span>
       </button>`;

  main.innerHTML = `
    <div class="top-bar">
      <h2>
        <button class="back-btn" id="back-btn" aria-label="Back">
          <svg viewBox="0 0 24 24"><path d="M7.414 13l5.043 5.04-1.414 1.42L3.586 12l7.457-7.46 1.414 1.42L7.414 11H21v2H7.414z"/></svg>
        </button>
        <span style="display:flex;flex-direction:column;line-height:1.2">
          <span>${escapeHtml(u.name)}</span>
          <span style="font-size:13px;color:var(--muted);font-weight:400">${myPosts.length} post${myPosts.length === 1 ? '' : 's'}</span>
        </span>
      </h2>
    </div>
    <div class="profile-banner"></div>
    <div class="profile-head">
      <div class="avatar-wrap">
        ${avatarHTML(u, { cls: 'lg' })}
        ${headerBtn}
      </div>
      <div class="profile-name">
        <span>${escapeHtml(u.name)}</span>
        ${badgeSVG(u.verified)}
        ${affiliationBadge(u)}
        ${customBadge(u)}
      </div>
      <div class="profile-handle">@${escapeHtml(u.username)}</div>
      ${u.bio ? `<div class="profile-bio">${escapeHtml(u.bio)}</div>` : ''}
      <div class="profile-meta">Joined ${new Date(u.joinedAt).toLocaleDateString(undefined, { month: 'long', year: 'numeric' })}</div>
      <div class="profile-stats">
        <div data-list="following" data-user="${escapeHtml(u.username)}"><b>${followingN}</b><span class="label">Following</span></div>
        <div data-list="followers" data-user="${escapeHtml(u.username)}"><b>${followers}</b><span class="label">Followers</span></div>
      </div>
    </div>
    <div id="profile-feed"></div>
  `;
  $('back-btn').addEventListener('click', () => navigate('home'));
  if (isMe) {
    $('edit-profile-btn').addEventListener('click', openEditProfile);
  } else {
    $('follow-btn').addEventListener('click', () => {
      const wasFollowing = isFollowing(u.username);
      toggleFollow(u.username);
      renderProfile();
      renderRightSidebar();
      showToast(wasFollowing ? 'Unfollowed @' + u.username : 'Following @' + u.username);
    });
  }
  document.querySelectorAll('.profile-stats > div').forEach(el => {
    el.addEventListener('click', () => openFollowList(el.dataset.user, el.dataset.list));
  });

  const feed = $('profile-feed');
  if (myPosts.length === 0) {
    feed.innerHTML = `<div class="empty"><h3>No posts yet</h3><p>${isMe ? 'When you post, your posts will show up here.' : '@' + u.username + ' has not posted yet.'}</p></div>`;
  } else {
    feed.innerHTML = myPosts
      .sort((a, b) => b.createdAt - a.createdAt)
      .map(post => renderTweetCard({ kind: 'post', post })).join('');
    wireTweets();
  }
}

function openFollowList(username, type) {
  let users;
  if (type === 'followers') {
    users = Object.values(db.users).filter(u =>
      u.username !== username && (u.following || []).includes(username)
    );
  } else {
    const u = db.users[username];
    users = ((u && u.following) || []).map(uname => db.users[uname]).filter(Boolean);
  }
  const title = type === 'followers' ? 'Followers' : 'Following';
  const emptyText = type === 'followers'
    ? '@' + username + ' has no followers yet.'
    : '@' + username + ' is not following anyone yet.';
  $('compose-modal-body').innerHTML = `
    <div>
      <h3 style="padding:16px;font-size:18px;border-bottom:1px solid var(--border)">${title}</h3>
      ${users.length === 0
        ? `<div class="empty"><p>${emptyText}</p></div>`
        : users.map(u => `
          <div class="search-user" data-user="${escapeHtml(u.username)}">
            ${avatarHTML(u)}
            <div class="meta">
              <div class="name">${escapeHtml(u.name)}${badgeSVG(u.verified)}${affiliationBadge(u)}${customBadge(u)}</div>
              <div class="handle">@${escapeHtml(u.username)}</div>
            </div>
          </div>
        `).join('')}
    </div>
  `;
  $('compose-modal').classList.add('show');
  document.querySelectorAll('#compose-modal .search-user').forEach(el => {
    el.addEventListener('click', () => {
      closeComposeModal();
      navigate('profile', { username: el.dataset.user });
    });
  });
}

function openEditProfile() {
  // Working copy so cancel doesn't dirty the user record
  let workingImage = currentUser.avatarImage || null;
  let workingColor = currentUser.avatarColor || null;
  const swatches = AVATAR_COLORS;

  function renderEditor() {
    const previewStyle = workingImage
      ? `background-image:url('${workingImage}')`
      : `background:${workingColor || avatarColor(currentUser.username)}`;
    const previewContent = workingImage ? '' : escapeHtml(initials(currentUser.name));
    $('compose-modal-body').innerHTML = `
      <div style="padding:16px">
        <h3 style="margin-bottom:16px;font-size:18px">Edit profile</h3>

        <div class="avatar-editor">
          <div class="preview" id="avatar-preview" style="${previewStyle}">${previewContent}</div>
          <div class="controls">
            <input type="file" id="avatar-file" accept="image/*" style="display:none" />
            <button class="upload-btn" id="upload-avatar-btn">Upload image</button>
            ${(workingImage || workingColor) ? '<button class="clear-btn" id="clear-avatar-btn">Reset</button>' : ''}
            <div class="color-swatches">
              ${swatches.map(c => `
                <div class="color-swatch ${(!workingImage && workingColor === c) ? 'selected' : ''}" data-color="${c}" style="background:${c}"></div>
              `).join('')}
            </div>
          </div>
        </div>

        <div style="margin-bottom:12px">
          <label style="display:block;margin-bottom:6px;color:var(--muted);font-size:13px">Display name</label>
          <input type="text" id="edit-name" maxlength="50" value="${escapeHtml(currentUser.name)}" />
        </div>
        <div style="margin-bottom:12px">
          <label style="display:block;margin-bottom:6px;color:var(--muted);font-size:13px">Bio</label>
          <textarea id="edit-bio" rows="3" maxlength="160" style="border:1px solid var(--border);padding:12px;border-radius:4px">${escapeHtml(currentUser.bio || '')}</textarea>
        </div>
        <button class="save-btn" id="edit-save">Save</button>
      </div>
    `;

    $('upload-avatar-btn').addEventListener('click', () => $('avatar-file').click());
    $('avatar-file').addEventListener('change', (e) => {
      const file = e.target.files[0];
      if (!file) return;
      if (!file.type.startsWith('image/')) { showToast('Please select an image'); return; }
      const reader = new FileReader();
      reader.onload = (ev) => {
        const img = new Image();
        img.onload = () => {
          // Crop to square center, resize to 200×200, encode as JPEG
          const canvas = document.createElement('canvas');
          const size = 200;
          canvas.width = size;
          canvas.height = size;
          const ctx = canvas.getContext('2d');
          const sourceSize = Math.min(img.width, img.height);
          const sx = (img.width - sourceSize) / 2;
          const sy = (img.height - sourceSize) / 2;
          ctx.drawImage(img, sx, sy, sourceSize, sourceSize, 0, 0, size, size);
          workingImage = canvas.toDataURL('image/jpeg', 0.85);
          workingColor = null;
          renderEditor();
        };
        img.onerror = () => showToast('Could not load image');
        img.src = ev.target.result;
      };
      reader.readAsDataURL(file);
    });

    const clearBtn = $('clear-avatar-btn');
    if (clearBtn) clearBtn.addEventListener('click', () => {
      workingImage = null;
      workingColor = null;
      renderEditor();
    });

    document.querySelectorAll('.color-swatch').forEach(sw => {
      sw.addEventListener('click', () => {
        workingImage = null;
        workingColor = sw.dataset.color;
        renderEditor();
      });
    });

    $('edit-save').addEventListener('click', () => {
      const name = $('edit-name').value.trim();
      const bio = $('edit-bio').value.trim();
      if (!name) { showToast('Name required'); return; }
      currentUser.name = name;
      currentUser.bio = bio;
      currentUser.avatarImage = workingImage;
      currentUser.avatarColor = workingColor;
      db.users[currentUser.username] = currentUser;
      saveDB(db);
      renderMeCard();
      renderRightSidebar();
      closeComposeModal();
      render();
      showToast('Profile updated');
    });
  }

  $('compose-modal').classList.add('show');
  renderEditor();
}

/* =========================================================
   Settings
   ========================================================= */
function renderSettings() {
  const main = $('main-content');
  const v = currentUser.verified || 'none';
  const isGold = v === 'gold';
  const myAffiliates = isGold
    ? Object.values(db.users).filter(u => u.affiliatedTo === currentUser.username)
    : [];

  let badgeStatusText = 'No badge';
  if (v === 'blue') badgeStatusText = 'Blue (individual)';
  if (v === 'gold') badgeStatusText = 'Gold (organization)';

  let affiliatesHTML = '';
  if (isGold) {
    affiliatesHTML = `
      <div class="settings-section">
        <h3>Affiliated accounts</h3>
        <p>As a gold organization, you can affiliate other accounts. Each affiliate displays a small badge linking back to your profile — like NFL team accounts under @NFL.</p>
        <div class="aff-add-row">
          <input type="text" id="aff-input" placeholder="Username to affiliate" maxlength="20" />
          <button class="save-btn" id="aff-add">Affiliate</button>

        ${myAffiliates.length === 0
          ? '<p style="color:var(--muted)">No affiliated accounts yet.</p>'
          : myAffiliates.map(u => `
            <div class="affiliate-row">
              ${avatarHTML(u)}
              <div style="flex:1;min-width:0">
                <div style="font-weight:700;display:flex;align-items:center;gap:4px">${escapeHtml(u.name)}${badgeSVG(u.verified)}${customBadge(u)}</div>
                <div style="color:var(--muted);font-size:13px">@${escapeHtml(u.username)}</div>
              </div>
              <button class="aff-remove" data-user="${escapeHtml(u.username)}">Remove</button>
            </div>
          `).join('')}
      </div>
    `;
  }

  main.innerHTML = `
    <div class="top-bar">
      <h2>Settings</h2>
    </div>
    <div class="settings-section">
      <h3>Verification</h3>
      <p>Verification badges are granted by an admin. ${currentUser.isAdmin ? "You're an admin — open the Admin tab to grant or revoke badges." : "Ask an admin if you think you should be verified."}</p>
      <div style="display:flex;align-items:center;gap:8px;font-size:15px;margin-top:8px">
        <b>Your badge:</b>
        ${badgeSVG(v)}
        <span>${badgeStatusText}</span>
      </div>
    </div>
    ${affiliatesHTML}
    <div class="settings-section">
      <h3>Account</h3>
      <p>Logged in as @${escapeHtml(currentUser.username)}${currentUser.isAdmin ? ' · Admin' : ''}</p>
      <button class="logout-btn" id="logout-btn">Log out</button>
    </div>
    ${currentUser.isAdmin ? `
      <div class="settings-section">
        <h3 style="color:var(--danger)">Danger zone</h3>
        <p>Reset this browser's data — deletes every account, post, and follow saved here. Cannot be undone.</p>
        <button class="logout-btn" id="reset-all-btn">Reset everything</button>
      </div>
    ` : ''}
  `;

  if (isGold) {
    $('aff-add').addEventListener('click', () => {
      const target = $('aff-input').value.trim().toLowerCase();
      if (!target) { showToast('Enter a username'); return; }
      if (target === currentUser.username) { showToast("You can't affiliate yourself"); return; }
      const u = db.users[target];
      if (!u) { showToast('No user with that username'); return; }
      u.affiliatedTo = currentUser.username;
      saveDB(db);
      renderSettings();
      showToast('Affiliated @' + target);
    });
    document.querySelectorAll('.aff-remove').forEach(btn => {
      btn.addEventListener('click', () => {
        const u = db.users[btn.dataset.user];
        if (!u) return;

        saveDB(db);

  });

  if (resetBtn) {
    resetBtn.addEventListener('click', () => {
      if (!confirm("Delete ALL users, posts, and follows from this browser? This can't be undone.")) return;
      storage.remove(DB_KEY);
      storage.remove(SESSION_KEY);

function renderSearch() {
  const main = $('main-content');
  main.innerHTML = `
    <div class="top-bar">
      <h2>Search</h2>
    </div>
    <div class="search-wrap">
      <input type="text" class="search-input" id="search-input" placeholder="Search posts and people" autocomplete="off" />
    </div>
    <div id="search-results">
      <div class="empty">
        <h3>Find what's happening</h3>
        <p>Search for people by name or username, or for any post by its text.</p>
      </div>
    </div>
  `;
  const input = $('search-input');
  input.focus();
  input.addEventListener('input', performSearch);
}

function performSearch() {
  const q = $('search-input').value.trim().toLowerCase();
  const results = $('search-results');
  if (!q) {
    results.innerHTML = `
      <div class="empty">
        <h3>Find what's happening</h3>
        <p>Search for people by name or username, or for any post by its text.</p>
      </div>
    `;
    return;
  }
  const userMatches = Object.values(db.users).filter(u =>
    u.username.toLowerCase().includes(q) || u.name.toLowerCase().includes(q)
  ).slice(0, 20);
  const postMatches = db.posts.filter(p =>
    !p.deleted && p.text.toLowerCase().includes(q)
  ).sort((a, b) => b.createdAt - a.createdAt).slice(0, 50);

  if (userMatches.length === 0 && postMatches.length === 0) {
    results.innerHTML = `
      <div class="empty">
        <h3>No results for "${escapeHtml(q)}"</h3>
        <p>Try a different word or check the spelling.</p>
      </div>
    `;
    return;
  }

  let html = '';
  if (userMatches.length > 0) {
    html += '<h3 class="search-section-head">People</h3>';
    html += userMatches.map(u => `
      <div class="search-user profile-link" data-user="${escapeHtml(u.username)}">
        ${avatarHTML(u)}
        <div class="meta">
          <div class="name">${escapeHtml(u.name)}${badgeSVG(u.verified)}${affiliationBadge(u)}${customBadge(u)}</div>
          <div class="handle">@${escapeHtml(u.username)}</div>
        </div>
      </div>
    `).join('');
  }
  if (postMatches.length > 0) {
    html += '<h3 class="search-section-head">Posts</h3>';
    html += postMatches.map(post => renderTweetCard({ kind: 'post', post })).join('');
  }
  results.innerHTML = html;

  document.querySelectorAll('.search-user').forEach(el => {
    el.addEventListener('click', () => navigate('profile', { username: el.dataset.user }));
  });
  wireTweets();
}

function renderAdmin() {
  if (!currentUser.isAdmin) { navigate('home'); return; }
  const main = $('main-content');
  const users = Object.values(db.users).sort((a, b) => a.joinedAt - b.joinedAt);
  const adminCount = users.filter(u => u.isAdmin).length;
  main.innerHTML = `
    <div class="top-bar">
      <h2>Admin</h2>
    </div>
    <div style="padding:16px;border-bottom:1px solid var(--border)">
      <p style="color:var(--muted);font-size:14px">
        Grant or revoke verification badges. Gold-verified accounts can affiliate other users from their own Settings page.
      </p>
    </div>
    ${users.map(u => {
      const isMe = u.username === currentUser.username;
      const lastAdmin = u.isAdmin && adminCount === 1;
      return `
        <div class="admin-row" data-user="${escapeHtml(u.username)}">
          ${avatarHTML(u)}
          <div class="meta">
            <div class="name">${escapeHtml(u.name)}${badgeSVG(u.verified)}${affiliationBadge(u)}${customBadge(u)}</div>
            <div class="handle">@${escapeHtml(u.username)}</div>
          </div>
          <select class="admin-badge" data-user="${escapeHtml(u.username)}">
            <option value="none" ${u.verified === 'none' ? 'selected' : ''}>No badge</option>
            <option value="blue" ${u.verified === 'blue' ? 'selected' : ''}>Blue</option>
            <option value="gold" ${u.verified === 'gold' ? 'selected' : ''}>Gold</option>
          </select>
          <input type="text" class="admin-custom-badge" data-user="${escapeHtml(u.username)}" value="${escapeHtml(u.customBadge || '')}" placeholder="Custom badge" maxlength="20" />
          <label class="adm">
            <input type="checkbox" class="admin-toggle" data-user="${escapeHtml(u.username)}" ${u.isAdmin ? 'checked' : ''} ${(isMe || lastAdmin) ? 'disabled' : ''} />
            Admin
          </label>
        </div>
      `;
    }).join('')}
    <div class="settings-section">
      <h3>Sync between devices</h3>
      <p>Each device stores its own private data. To copy it to another device, export here, then send the file to the other device (AirDrop, email, text) and import there.</p>
      <div style="display:flex;gap:8px;flex-wrap:wrap;margin-top:8px">
        <button class="save-btn" id="export-data-btn">Export data</button>
        <button class="save-btn" id="import-data-btn" style="background:transparent;color:var(--text);border:1px solid var(--border)">Import data</button>
        <input type="file" id="import-data-file" accept=".json,application/json" style="display:none" />
      </div>
      <p style="font-size:13px;color:var(--muted);margin-top:10px">${Object.keys(db.users).length} account${Object.keys(db.users).length === 1 ? '' : 's'}, ${db.posts.filter(p => !p.deleted).length} post${db.posts.filter(p => !p.deleted).length === 1 ? '' : 's'} on this device.</p>
      <p style="font-size:13px;color:${CLOUD_ENABLED ? 'var(--repost)' : 'var(--muted)'};margin-top:6px">
        ${CLOUD_ENABLED
          ? '☁️ Cloud sync: ON — all devices share the same data automatically'
          : 'Cloud sync: OFF — open index.html, fill in CLOUD.binId and CLOUD.masterKey at the top of the script to enable cross-device sync. See the comment above for setup steps.'}
      </p>
    </div>
  `;

  document.querySelectorAll('.admin-badge').forEach(sel => {
    sel.addEventListener('change', () => {
      const target = db.users[sel.dataset.user];
      if (!target) return;
      const wasGold = target.verified === 'gold';
      target.verified = sel.value;
      // If demoted from gold, clear all affiliations they granted
      if (wasGold && sel.value !== 'gold') {
        for (const u of Object.values(db.users)) {
          if (u.affiliatedTo === target.username) u.affiliatedTo = null;
        }
      }
      saveDB(db);
      if (target.username === currentUser.username) renderMeCard();
      renderAdmin();
      showToast('Updated @' + target.username);
    });
  });
  document.querySelectorAll('.admin-toggle').forEach(cb => {
    cb.addEventListener('change', () => {
      const target = db.users[cb.dataset.user];
      if (!target) return;
      target.isAdmin = cb.checked;
      saveDB(db);
      renderAdmin();
      showToast(cb.checked ? 'Promoted @' + target.username : 'Demoted @' + target.username);
    });
  });
  document.querySelectorAll('.admin-custom-badge').forEach(input => {
    function save() {
      const target = db.users[input.dataset.user];
      if (!target) return;
      const newValue = input.value.trim().slice(0, 20);
      const old = target.customBadge || '';
      if (newValue === old) return;
      target.customBadge = newValue || null;
      saveDB(db);
      showToast(newValue ? 'Set badge for @' + target.username : 'Cleared badge for @' + target.username);
    }
    input.addEventListener('blur', save);
    input.addEventListener('keydown', e => {
      if (e.key === 'Enter') { e.preventDefault(); input.blur(); }
    });
  });

  // Export / Import
  $('export-data-btn').addEventListener('click', () => {
    const blob = new Blob([JSON.stringify(db, null, 2)], { type: 'application/json' });
    const url = URL.createObjectURL(blob);
    const a = document.createElement('a');
    a.href = url;
    a.download = `chirp-${new Date().toISOString().slice(0,10)}.json`;
    document.body.appendChild(a);
    a.click();
    document.body.removeChild(a);
    URL.revokeObjectURL(url);
    showToast('Exported');
  });
  $('import-data-btn').addEventListener('click', () => $('import-data-file').click());
  $('import-data-file').addEventListener('change', (e) => {
    const file = e.target.files[0];
    if (!file) return;
    const reader = new FileReader();
    reader.onload = (ev) => {
      try {
        const imported = JSON.parse(ev.target.result);
        if (typeof imported.users !== 'object' || imported.users === null || !Array.isArray(imported.posts)) {
          throw new Error('Bad file format');
        }
        const userCount = Object.keys(imported.users).length;
        const postCount = imported.posts.length;
        if (!confirm(`Replace this browser's data with ${userCount} account(s) and ${postCount} post(s) from the imported file? This can't be undone.`)) {
          e.target.value = '';
          return;
        }
        storage.set(DB_KEY, JSON.stringify(imported));
        storage.remove(SESSION_KEY); // log out — imported users may differ
        location.reload();
      } catch (err) {
        showToast('Invalid file');
        e.target.value = '';
      }
    };
    reader.readAsText(file);
  });
}

/* =========================================================
   Right sidebar
   ========================================================= */
function renderRightSidebar() {
  // Trends are inferred from real posts: most-used words longer than 3 chars
  const counts = {};
  for (const p of db.posts) {
    if (p.deleted) continue;
    const words = p.text.split(/\s+/);
    for (let w of words) {
      if (w.startsWith('#')) {
        const tag = w.replace(/[^\w#]/g, '');
        if (tag.length > 1) counts[tag] = (counts[tag] || 0) + 1;
      }
    }
  }
  const trends = Object.entries(counts).sort((a, b) => b[1] - a[1]).slice(0, 5);
  $('trends').innerHTML = trends.length === 0
    ? '<div class="panel-item"><div class="small">Nothing trending yet. Use #hashtags in posts to start a trend.</div></div>'
    : trends.map(([tag, n]) => `
        <div class="panel-item">
          <div class="small">Trending</div>
          <div class="name">${escapeHtml(tag)}</div>
          <div class="followers">${n} post${n === 1 ? '' : 's'}</div>
        </div>
      `).join('');

  // Suggestions are real users you haven't followed
  const others = Object.values(db.users)
    .filter(u => u.username !== currentUser.username && !isFollowing(u.username))
    .slice(0, 3);
  $('suggestions').innerHTML = others.length === 0
    ? '<div class="panel-item"><div class="small">No suggestions right now.</div></div>'
    : others.map(u => `
        <div class="panel-item profile-link" data-user="${escapeHtml(u.username)}">
          <div class="name">${escapeHtml(u.name)}${badgeSVG(u.verified)}${affiliationBadge(u)}${customBadge(u)}</div>
          <div class="followers">@${escapeHtml(u.username)}</div>
        </div>
      `).join('');
  document.querySelectorAll('aside.right .profile-link').forEach(el => {
    el.addEventListener('click', () => navigate('profile', { username: el.dataset.user }));
  });
}

/* =========================================================
   Boot
   ========================================================= */
(async function boot() {
  if (CLOUD_ENABLED) {
    const remote = await cloudPull();
    if (remote) {
      db.users = remote.users || {};
      db.posts = Array.isArray(remote.posts) ? remote.posts : [];
      // Re-run migrations on cloud data
      for (const u of Object.values(db.users)) {
        if (typeof u.isAdmin === 'undefined') u.isAdmin = false;
        if (typeof u.affiliatedTo === 'undefined') u.affiliatedTo = null;
        if (typeof u.avatarImage === 'undefined') u.avatarImage = null;
        if (typeof u.avatarColor === 'undefined') u.avatarColor = null;
        if (!Array.isArray(u.following)) u.following = [];
      }
      const userList = Object.values(db.users);
      if (userList.length > 0 && !userList.some(u => u.isAdmin)) {
        userList.sort((a, b) => a.joinedAt - b.joinedAt)[0].isAdmin = true;
      }
      storage.set(DB_KEY, JSON.stringify(db));
    }
  }
  const session = getSession();
  if (session && db.users[session]) {
    enterApp();
  } else {
    setAuthMode(false);
  }
})();

// Re-render right sidebar when navigating so trends update
const _origRender = render;
render = function () { _origRender(); renderRightSidebar(); };
</script>

</body>
</html>
